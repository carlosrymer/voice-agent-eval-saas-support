[project]
name = "voice-agent-eval-saas-support"
version = "0.1.0"
description = "Three-axis voice-agent evaluation (execution / outcome / experience) over a tau2-bench B2B SaaS support domain, with measured rather than judged experience metrics."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "tau2 @ git+https://github.com/sierra-research/tau2-bench@v1.0.1",
    "websockets>=13.0",
    "httpx>=0.28.1",
    "numpy>=2.1",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "openinference-semantic-conventions>=0.1.30",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["voiceval", "saas_support"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
